name: IndexNow

# After each successful Vercel production deploy, tell Bing and other IndexNow engines to recrawl the sitemap.
on:
  deployment_status:

jobs:
  ping:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/indexnow.mjs https://fernando-gomez-graciani.vercel.app
